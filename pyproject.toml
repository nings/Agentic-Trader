[project]
name = "autonomous-agents"
version = "2.0.0"
description = "OpenAlgo Autonomous AI Trading Agent - Refactored & Production-Ready"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "openai-agents[litellm,sqlalchemy]>=0.1.0",
    "openalgo>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "apscheduler>=3.10.0",
    "pytz>=2024.1",
    "numba>=0.60.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "colorama>=0.4.6",
    "ta-lib>=0.4.28",
    "aiosqlite>=0.19.0",
    "tenacity>=8.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
]
