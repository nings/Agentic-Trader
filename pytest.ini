[pytest]
# pytest配置文件

# 测试路径
testpaths = agentic_trader/tests

# Python文件模式
python_files = test_*.py

# Python类模式
python_classes = Test*

# Python函数模式
python_functions = test_*

# 最小Python版本
minversion = 7.0

# 额外命令行选项
addopts =
    # 显示详细输出
    -v
    # 显示测试摘要信息
    -ra
    # 显示本地变量（失败时）
    --showlocals
    # 严格标记（未注册的标记会报错）
    --strict-markers
    # 禁用警告摘要
    --disable-warnings
    # 覆盖率配置
    --cov=agentic_trader
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    # 并行执行（使用所有CPU核心）
    # -n auto
    # 显示最慢的10个测试
    --durations=10

# 标记定义
markers =
    unit: 单元测试 - 测试单个组件
    integration: 集成测试 - 测试多个组件协作
    slow: 慢速测试 - 运行时间较长的测试
    api: API测试 - 需要API访问的测试
    mock: Mock测试 - 使用Mock对象的测试
    state: 状态测试 - 测试状态管理
    risk: 风险测试 - 测试风险管理
    order: 订单测试 - 测试订单执行
    market: 市场数据测试 - 测试市场数据获取
    indicators: 指标测试 - 测试技术指标计算
    backtest: 回测测试 - 测试回测功能

# 日志配置
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置
[coverage:run]
source = agentic_trader
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*

[coverage:report]
exclude_lines =
    # 标准排除
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    # 调试代码
    if self.debug:
    if settings.DEBUG
    # 类型检查
    if typing.TYPE_CHECKING:

precision = 2
show_missing = true
